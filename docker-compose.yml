version: '3.9'

services:
  postgres:
    image: imresamu/postgis:16-3.4-alpine
    container_name: tabhop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tabhop_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tabhop

volumes:
  postgres_data:
    driver: local

networks:
  tabhop:
    driver: bridge
